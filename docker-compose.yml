# Local testing: docker compose up --build -d, then open http://localhost:3000.
# No sign-up or login. Tasks are held in memory and reset when the server restarts.
services:
  server:
    build: .
    environment:
      DATABASE_URL: ""
      MOMENTUM_BIND_ADDR: 0.0.0.0:3000
      MOMENTUM_SECURE_COOKIES: "false"
    ports:
      - "127.0.0.1:3000:3000"
