[package]
name = "momentum-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Leptos/Axum web application for Momentum"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["ssr"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:any_spawner",
    "dep:momentum-infra",
    "dep:leptos_axum",
    "dep:form_urlencoded",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
hydrate = [
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "leptos/hydrate",
]

[dependencies]
momentum-domain.workspace = true
momentum-app.workspace = true
momentum-infra = { workspace = true, optional = true }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
any_spawner = { workspace = true, optional = true }
http.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
momentum-testkit.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

[[bin]]
name = "momentum-server"
path = "src/main.rs"
required-features = ["ssr"]
